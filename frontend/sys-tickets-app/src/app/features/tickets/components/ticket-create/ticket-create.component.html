<mat-toolbar color="primary">
  <button mat-icon-button routerLink="/tickets"><mat-icon>arrow_back</mat-icon></button>
  <span>Crear Nuevo Ticket</span>
</mat-toolbar>

<mat-card style="max-width:640px; margin:24px auto">
  <mat-card-header>
    <mat-card-title>Nuevo ticket de soporte</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-card style="background:#fce4ec; margin-bottom:16px" *ngIf="error$ | async as error">
      <mat-card-content>⚠️ {{error}}</mat-card-content>
    </mat-card>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" style="display:flex; flex-direction:column; gap:8px">

      <mat-form-field appearance="outline">
        <mat-label>Título</mat-label>
        <input matInput formControlName="titulo" placeholder="Describe brevemente el problema">
        <mat-error *ngIf="form.get('titulo')?.hasError('required')">El título es obligatorio</mat-error>
        <mat-error *ngIf="form.get('titulo')?.hasError('maxlength')">Máximo 200 caracteres</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="descripcion" rows="5"
          placeholder="Detalla el problema: pasos para reproducirlo, mensajes de error, etc."></textarea>
        <mat-error *ngIf="form.get('descripcion')?.hasError('required')">La descripción es obligatoria</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="categoriaId">
          <mat-option *ngFor="let c of (categorias$ | async)" [value]="c.id">{{c.nombre}}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('categoriaId')?.hasError('required')">Selecciona una categoría</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Prioridad</mat-label>
        <mat-select formControlName="prioridad">
          <mat-option *ngFor="let p of prioridades" [value]="p">{{p | titlecase}}</mat-option>
        </mat-select>
      </mat-form-field>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:8px">
        <button mat-stroked-button type="button" routerLink="/tickets">Cancelar</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="creando$ | async">
          <mat-progress-spinner *ngIf="creando$ | async" diameter="18" mode="indeterminate" style="display:inline-block"></mat-progress-spinner>
          Crear ticket
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
