services:
  db:
    image: postgres:14-alpine
    container_name: support_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_tickets
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/02_functions.sql:/docker-entrypoint-initdb.d/02_functions.sql
      - ./database/03_indexes.sql:/docker-entrypoint-initdb.d/03_indexes.sql
      - ./database/04_seed.sql:/docker-entrypoint-initdb.d/04_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: support_apis
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=support_tickets;Username=postgres;Password=postgres"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/sys-tickets-app
      dockerfile: Dockerfile
    container_name: support_frontend
    ports:
      - "9000:80"
    depends_on:
      - api

volumes:
  postgres_data:
